name: Verify

on:
  push:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - action.yml
      - ".github/workflows/**"
      - "testdata/dockerfiles/**"
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - action.yml
      - ".github/workflows/**"
      - "testdata/dockerfiles/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -o dockopt ./cmd/dockopt
      - name: Verify composite action
        uses: ./
        with:
          path: testdata/dockerfiles/clean.Dockerfile
          fail-on: error
          upload-sarif: "false"
      - name: Verify fixture exit contracts
        shell: bash
        run: |
          for fixture in clean clean-go-env complex-multistage; do
            json="$(./dockopt --json "testdata/dockerfiles/$fixture.Dockerfile")"
            printf '%s: %s\n' "$fixture" "$json"
            grep -Fq '"findings":[]' <<<"$json"
          done
          ./dockopt --json testdata/dockerfiles/unsupported-python.Dockerfile >/tmp/python.json
          grep -Fq 'PY001' /tmp/python.json
          grep -Fq '"schema_version":"2"' /tmp/python.json
          grep -Fq '"suggested_fix":' /tmp/python.json
          ./dockopt --json --ignore GEN001,GEN005,GEN010 testdata/dockerfiles/warn-latest.Dockerfile | grep -Fq '"findings":[]'
          ./dockopt --sarif testdata/dockerfiles/warn-untagged.Dockerfile >/tmp/dockopt.sarif
          grep -Fq '"version":"2.1.0"' /tmp/dockopt.sarif
          grep -Fq '"ruleId":"GEN001"' /tmp/dockopt.sarif

          set +e
          ./dockopt --json testdata/dockerfiles/error-go-static.Dockerfile >/tmp/error.json
          error_status=$?
          ./dockopt --json testdata/dockerfiles/malformed.Dockerfile >/tmp/parse.json
          parse_status=$?
          ./dockopt --fail-on warn testdata/dockerfiles/warn-untagged.Dockerfile >/tmp/untagged.txt
          untagged_status=$?
          ./dockopt --fail-on warn testdata/dockerfiles/warn-apt.Dockerfile >/tmp/apt.txt
          apt_status=$?
          # aggregate exit: one clean + one unparseable must surface as 2
          ./dockopt --json testdata/dockerfiles/clean.Dockerfile testdata/dockerfiles/malformed.Dockerfile >/tmp/multi.jsonl
          multi_status=$?
          set -e

          test "$error_status" = "1"
          test "$parse_status" = "2"
          test "$untagged_status" = "1"
          grep -Fq 'GEN001' /tmp/untagged.txt
          test "$apt_status" = "1"
          for id in GEN002 GEN003 GEN004 GEN005; do grep -Fq "$id" /tmp/apt.txt; done
          test "$multi_status" = "2"
          test "$(grep -c '"schema_version"' /tmp/multi.jsonl)" = "2"
